name: CI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos Manually
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          # تحميل الـ SDK عشان الكود يعرف يتبرمج للآيفون
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz
          mkdir -p $HOME/theos/sdks
          tar -xf iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks

      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hamad-Shield-File
          path: packages/*.deb
