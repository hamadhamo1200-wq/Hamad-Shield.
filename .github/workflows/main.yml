name: Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    # ده السطر اللي جيت هاب طالبه منك في الصورة عشان يحل مشكلة Node
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        # المرة دي هنستخدم رابط مباشر وصريح عشان ميبقاش فيه "Repository not found"
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -L https://github.com/theos/sdks/raw/master/iPhoneOS14.5.sdk.tar.xz -o $HOME/theos/sdks/iPhoneOS14.5.sdk.tar.xz
          tar -xf $HOME/theos/sdks/iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hamad-Shield-File
          path: packages/*.deb
