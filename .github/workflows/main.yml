name: Build Hamad Shield
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Theos
        uses: p0009/setup-theos@main

      - name: Build Tweak
        run: |
          make package
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Hamad-Shield-File
          path: packages/*.deb
